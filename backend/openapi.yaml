openapi: 3.0.3
info:
  title: 1Carry3Monkey API
  version: "1.0"
  description: >
    REST API backing the 1Carry3Monkey chat app. Mutations and one-shot reads live
    here; pushed/realtime data (new messages, typing, presence, group membership
    changes) goes over the WebSocket documented under the `realtime` tag below —
    OpenAPI has no first-class vocabulary for a socket, so it's written up as a
    single GET whose "response" is the set of frame shapes the server can push,
    same approach backend/API.md §5 uses in prose.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: clients
  - name: groups
  - name: rooms
  - name: ai
  - name: realtime

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register — pick a unique display name and password to create a client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                  example: Nara
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                type: object
                required: [token, client]
                properties:
                  token:
                    type: string
                    example: 4daf26bac3ee75d75e0d203e448f8cc
                  client:
                    $ref: "#/components/schemas/Client"
        "400":
          description: EMPTY_NAME, NAME_TOO_LONG, EMPTY_PASSWORD, or PASSWORD_TOO_SHORT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: NAME_TAKEN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with an existing display name and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                  example: Nara
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                required: [token, client]
                properties:
                  token:
                    type: string
                    example: 4daf26bac3ee75d75e0d203e448f8cc
                  client:
                    $ref: "#/components/schemas/Client"
        "400":
          description: EMPTY_NAME or EMPTY_PASSWORD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    delete:
      tags: [auth]
      operationId: logout
      summary: Logout — marks the client offline and invalidates the token
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List every client (for the Users tab). Fetched once on login; presence after that comes from the WS `presence` event.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/me:
    get:
      tags: [clients]
      operationId: getCurrentClient
      summary: The current client, resolved from the bearer token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties:
                  client: { $ref: "#/components/schemas/Client" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/me/unread-counts:
    get:
      tags: [clients]
      operationId: getUnreadCounts
      summary: Unread message counts per room, keyed by roomId. Fetched once on login/reconnect; kept current after that by the WS `unread` event.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unreadCounts]
                properties:
                  unreadCounts:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      "group:g-monkey-business": 2
                      "private:c-ploy": 1
        "401":
          $ref: "#/components/responses/Unauthorized"

  /groups:
    get:
      tags: [groups]
      operationId: listGroups
      summary: Every group, joined or not. Fetched once on login/reconnect; membership changes after that arrive as WS `group`/`groupDeleted` events.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group (creator becomes the sole member immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Jungle Devs
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400":
          description: EMPTY_NAME
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: GROUP_NAME_TAKEN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/members:
    post:
      tags: [groups]
      operationId: joinGroup
      summary: Join a group as the caller
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Joined — returns the updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: ALREADY_MEMBER
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/members/me:
    delete:
      tags: [groups]
      operationId: leaveGroup
      summary: Leave a group — if the caller was the last member, the group is deleted outright instead of being left empty
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Left the group
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: NOT_A_MEMBER
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rooms/{roomId}/messages:
    get:
      tags: [rooms]
      operationId: listMessages
      summary: Message history, cursor-paginated
      description: >
        Private rooms have no membership gate (any client may message any other).
        Group rooms require membership. Use `before` to page backwards for
        scroll-up history on initial room open; `after` to resync anything
        missed after a WS reconnect (new messages while connected arrive as
        the `message` WS event instead, see the `realtime` tag).
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: before
          in: query
          description: Epoch ms — return messages strictly older than this
          schema: { type: integer }
        - name: after
          in: query
          description: Epoch ms — return messages strictly newer than this (used to resync after a WS reconnect)
          schema: { type: integer }
        - name: limit
          in: query
          description: Max rows for the `before` page (default 50; ignored with `after`)
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages, hasMore]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  hasMore:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NOT_A_PARTICIPANT — group room you haven't joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CLIENT_NOT_FOUND — private room's other client doesn't exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [rooms]
      operationId: sendMessage
      summary: Send a message
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: are we on track for the deadline
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: EMPTY_TEXT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NOT_A_PARTICIPANT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CLIENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rooms/{roomId}/summary:
    post:
      tags: [rooms]
      operationId: summarizeRoom
      summary: Summarize the latest 200 messages in a room
      description: >
        The summary goes only to the caller. It is not stored or sent to the room.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Summarized
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: string
        "400":
          description: NOTHING_TO_SUMMARIZE | INVALID_ROOM_ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NOT_A_PARTICIPANT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: CLIENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: AI_RATE_LIMITED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: AI_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rooms/{roomId}/read:
    put:
      tags: [rooms]
      operationId: markRoomRead
      summary: Mark this room read as of now (clears the caller's unread count)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Marked read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NOT_A_PARTICIPANT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ai/speech-to-text:
    post:
      tags: [ai]
      operationId: speechToText
      summary: Transcribe a voice recording to text
      description: >
        Nothing is stored or sent to a room. Accepts webm, ogg, mp4, m4a, mp3,
        wav and flac, up to 25 MB. `text` is empty when no speech was recognised.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        "200":
          description: Transcribed
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
        "400":
          description: EMPTY_AUDIO | INVALID_AUDIO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: AUDIO_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: UNSUPPORTED_AUDIO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: AI_RATE_LIMITED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: AI_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ws:
    servers:
      - url: /
    get:
      tags: [realtime]
      operationId: realtimeConnect
      summary: Upgrade to a WebSocket — one connection per tab, every push type below multiplexed over it
      security: []
      description: >
        Not a real REST call — this is the HTTP GET that asks to switch protocols
        (`Connection: Upgrade`, `Upgrade: websocket`). The server replies
        `101 Switching Protocols` and from then on the same TCP connection carries
        WebSocket frames, each shaped `{ "type": "<name>", "payload": {...} }`.
        The `101` response below enumerates every `payload` the server can push,
        one schema per `type` — see backend/API.md §5 for the roomId addressing
        rule (private rooms are named relative to the recipient, group rooms use
        one shared id). Auth is a query param, not the `Authorization` header,
        because the browser `WebSocket` constructor can't set custom headers on
        the handshake request; a missing or invalid token gets the connection
        closed with code `4001` rather than an HTTP error body. The only frame
        the client ever sends back is `TypingSend` — no ack, and a `typing: true`
        with no follow-up is expected to expire on the receiving end after a few
        seconds rather than rely on an explicit "stop" always arriving.


        This connection replaces six REST endpoints that used to get polled on a
        timer — `GET /rooms/:roomId/messages?after=`, `GET`/`PUT
        /rooms/:roomId/typing` (both removed), `POST /sessions/me/heartbeat`
        (removed), `GET /clients`, `GET /groups`, and `GET
        /clients/me/unread-counts` — see the "What moved off REST" table in
        backend/API.md §5 for the full mapping. Every other REST operation in
        this document is unchanged.
      parameters:
        - name: token
          in: query
          required: true
          description: Same session token `POST /auth/login`/`register` returns.
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols — pushed frames match one of these schemas.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MessagePush"
                  - $ref: "#/components/schemas/TypingPush"
                  - $ref: "#/components/schemas/UnreadPush"
                  - $ref: "#/components/schemas/PresencePush"
                  - $ref: "#/components/schemas/ClientPush"
                  - $ref: "#/components/schemas/GroupPush"
                  - $ref: "#/components/schemas/GroupDeletedPush"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token returned by `POST /auth/register` or `POST /auth/login`

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
      example: g-monkey-business
    RoomId:
      name: roomId
      in: path
      required: true
      description: >
        `private:<clientId>` or `group:<groupId>`, relative to the caller.
        Percent-encode the colon (e.g. `group%3Ag-monkey-business`).
      schema: { type: string }
      example: "group:g-monkey-business"

  responses:
    Unauthorized:
      description: UNAUTHORIZED — missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Client:
      type: object
      required: [id, name, online]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
      example:
        id: c-nara
        name: Nara
        online: true

    Group:
      type: object
      required: [id, name, createdBy, memberIds]
      properties:
        id: { type: string }
        name: { type: string }
        createdBy:
          type: string
          description: Client.id of the creator
        memberIds:
          type: array
          items: { type: string }
      example:
        id: g-monkey-business
        name: Monkey Business
        createdBy: c-nara
        memberIds: [c-nara, c-ploy]

    Message:
      type: object
      required: [id, roomId, senderId, senderName, text, timestamp]
      properties:
        id: { type: string }
        roomId:
          type: string
          example: "group:g-monkey-business"
        senderId: { type: string }
        senderName: { type: string }
        text: { type: string }
        timestamp:
          type: integer
          description: Epoch ms
      example:
        id: m2
        roomId: "group:g-monkey-business"
        senderId: c-nara
        senderName: Nara
        text: are we on track for the deadline
        timestamp: 1735900100000

    MessagePush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [message] }
        payload: { $ref: "#/components/schemas/Message" }

    TypingPush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [typing] }
        payload:
          type: object
          required: [roomId, clientId, name, typing]
          properties:
            roomId: { type: string, example: "private:c-nara" }
            clientId: { type: string }
            name: { type: string }
            typing: { type: boolean }

    TypingSend:
      type: object
      description: Client → server. The one frame type sent instead of received.
      required: [type, roomId, typing]
      properties:
        type: { type: string, enum: [typing] }
        roomId: { type: string, example: "group:g-monkey-business" }
        typing: { type: boolean }

    UnreadPush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [unread] }
        payload:
          type: object
          required: [roomId, count]
          properties:
            roomId: { type: string, example: "private:c-ploy" }
            count: { type: integer }

    PresencePush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [presence] }
        payload:
          type: object
          required: [clientId, online]
          properties:
            clientId: { type: string }
            online: { type: boolean }

    ClientPush:
      type: object
      description: >
        Sent on registration — unlike `presence`, which only flips an online
        flag on a roster entry the receiver already has, this carries the full
        record for a client nobody's seen yet.
      required: [type, payload]
      properties:
        type: { type: string, enum: [client] }
        payload: { $ref: "#/components/schemas/Client" }

    GroupPush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [group] }
        payload: { $ref: "#/components/schemas/Group" }

    GroupDeletedPush:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [groupDeleted] }
        payload:
          type: object
          required: [groupId]
          properties:
            groupId: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NAME_TAKEN
            message:
              type: string
              example: '"Nara" is already taken. Try another name.'
