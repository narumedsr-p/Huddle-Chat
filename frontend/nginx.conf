server {
    listen 8888;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:4000/ws;
        proxy_http_version 1.1;
        # The handshake is a one-time Connection: Upgrade request (RFC 6455
        # §4.1) — nginx has to forward those two headers itself, it doesn't
        # do it by default the way it does for a plain reverse-proxied GET.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
